[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-traffic-analysis"
version = "0.1.0"
description = "Reproducible event-day traffic comparison and shuttle capacity analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chanhyuk Yoon"}]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
